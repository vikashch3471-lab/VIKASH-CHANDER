name: Build AVY v0.3.5 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AVY_v0.3.5_FINAL_SOURCE*.zip'
      - '.github/workflows/build-avy-v0.3.5-final.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Extract AVY source ZIP and locate Android project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'AVY_v0.3.5_FINAL_SOURCE*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::AVY v0.3.5 source ZIP not found in repository root."
            exit 1
          fi
          mkdir -p source
          unzip -q "$ZIP_FILE" -d source
          GRADLEW="$(find source -type f -name gradlew -print -quit)"
          if [ -z "$GRADLEW" ]; then
            echo "::error::Could not find gradlew inside the extracted ZIP."
            echo "Extracted files:"
            find source -maxdepth 4 -type f | head -100
            exit 1
          fi
          PROJECT_DIR="$(dirname "$GRADLEW")"
          if [ ! -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "::error::Gradle wrapper JAR is missing from $PROJECT_DIR."
            exit 1
          fi
          if [ ! -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" ]; then
            echo "::error::Android app manifest not found in $PROJECT_DIR."
            exit 1
          fi
          echo "AVY_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found Android project at: $PROJECT_DIR"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$AVY_PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace clean assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AVY-v0.3.5-debug-apk
          path: ${{ env.AVY_PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
