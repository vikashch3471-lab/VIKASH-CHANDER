name: Build AVY Gemini Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - AVY_Gemini_Brain_Source_NEW.zip
      - '.github/workflows/build-avy.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Gemini Brain Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f AVY_Gemini_Brain_Source_NEW.zip
          mkdir -p android-source
          unzip -q  -AVY_Gemini_Brain_Source_NEW.zip android-source
          PROJECT_DIR="$GITHUB_WORKSPACE/android-source/AVY_Android_Starter"
          test -f "$PROJECT_DIR/gradlew"
          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/java/com/avy/assistant/GeminiBrain.kt"
          chmod +x "$PROJECT_DIR/gradlew"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AVY-Gemini-Brain-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
