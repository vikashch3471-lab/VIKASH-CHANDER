name: Build AVY Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AVY_Full_Phone_Control_Package.zip'
      - '.github/workflows/build-avy.yml'

permissions:
  contents: read

env:
  ANDROID_PACKAGE: AVY_Full_Phone_Control_Package.zip

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract package and Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ANDROID_PACKAGE"
          mkdir -p package-unpacked android-source
          unzip -q "$ANDROID_PACKAGE" -d package-unpacked
          SOURCE_ZIP="$(find package-unpacked -type f -name 'AVY_Android_Enhanced_Source.zip' -print -quit)"
          test -n "$SOURCE_ZIP"
          unzip -q "$SOURCE_ZIP" -d android-source
          PROJECT_DIR="$GITHUB_WORKSPACE/android-source/AVY_Android_Starter"
          test -f "$PROJECT_DIR/gradlew"
          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/java/com/avy/assistant/GeminiBrain.kt"
          chmod +x "$PROJECT_DIR/gradlew"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AVY-Full-Phone-Control-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
