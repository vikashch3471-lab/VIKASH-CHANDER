name: Build AVY v0.2.0 APK

on:
  workflow_dispatch:
  push:
    paths:
       - 'AVY_Complete_Modular_Design_Source_v1*.zip' 
       - '.github/workflows/build-avy.yml'
                  
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Extract AVY source
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'AVY_Complete_Modular_Design_Source_v1*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo 'New AVY source ZIP was not found.'
            exit 1
          fi
          mkdir -p source
          unzip -q "$ZIP_FILE" -d source
          test -f source/AVY_Android_Starter/gradlew

      - name: Build debug APK
        working-directory: source/AVY_Android_Starter
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AVY-v0.2.0-debug-apk
          path: source/AVY_Android_Starter/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
