
name: Build AVY Complete Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AVY_Accessibility_Minimal_Source.zip'
      - '.github/workflows/build-avy.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Verify and extract AVY source
        shell: bash
        run: |
          set -euo pipefail
          test -f AVY_Accessibility_Minimal_Source.zip
          mkdir -p extracted
          unzip -q AVY_Accessibility_Minimal_Source.zip -d extracted
          PROJECT_DIR="$GITHUB_WORKSPACE/extracted/AVY_Android_Starter"
          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/gradlew"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AVY-Accessibility-Minimal-debug-apk
          path: extracted/AVY_Android_Starter/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
